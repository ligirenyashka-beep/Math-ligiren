<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Уравнения: Полное погружение</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@400;600;800&display=swap');
        
        :root {
            --bg-color: #e9e5db;
            --folder-color: #f4ecd8;
            --dark-ink: #2b2b2b;
            --accent-red: #c0392b;
            --success-green: #27ae60;
            --highlight: #f1c40f;
            --sidebar: #34495e;
            --sidebar-hover: #2c3e50;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            background-image: url('https://www.transparenttextures.com/patterns/cream-paper.png');
            color: var(--dark-ink);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 300px;
            background: var(--sidebar);
            color: white;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0,0,0,0.2);
            z-index: 10;
        }

        .sidebar-header {
            padding: 20px;
            font-family: 'Courier Prime', monospace;
            text-align: center;
            border-bottom: 2px solid #222;
            background: #222;
        }

        .sidebar-header h2 {
            margin: 0;
            font-size: 1.2em;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ecf0f1;
        }

        .level-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex-grow: 1;
        }

        .level-item {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.95em;
        }

        .level-item:hover {
            background: var(--sidebar-hover);
        }

        .level-item.active {
            background: var(--accent-red);
            font-weight: bold;
            border-left: 5px solid #e74c3c;
        }

        /* Main Content */
        .main-content {
            flex-grow: 1;
            padding: 30px 50px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .level-container {
            background-color: var(--folder-color);
            border: 2px solid #ccc;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.1), inset 0 0 50px rgba(220,210,190,0.5);
            border-radius: 5px 25px 5px 5px;
            width: 100%;
            max-width: 900px;
            position: relative;
            padding: 40px;
            box-sizing: border-box;
            display: none; /* Hidden by default */
        }

        .level-container.active {
            display: block;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .level-container::before {
            content: "ДОВЕРИТЕЛЬНО";
            position: absolute;
            top: -20px;
            left: -2px;
            background: var(--folder-color);
            border: 2px solid #ccc;
            border-bottom: none;
            padding: 5px 20px;
            font-family: 'Courier Prime', monospace;
            font-weight: bold;
            font-size: 0.8em;
            border-radius: 10px 10px 0 0;
            color: var(--accent-red);
        }

        .level-title {
            font-family: 'Courier Prime', monospace;
            font-size: 2em;
            font-weight: bold;
            margin: 0 0 10px 0;
            border-bottom: 2px dashed #999;
            padding-bottom: 10px;
        }

        .level-desc {
            font-size: 1.1em;
            background: rgba(241, 196, 15, 0.3);
            padding: 15px;
            border-left: 5px solid var(--highlight);
            margin-bottom: 30px;
            border-radius: 4px;
        }

        .progress-bar {
            display: flex;
            gap: 5px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .dot {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #ccc;
            transition: 0.3s;
        }
        .dot.completed { background: var(--success-green); }
        .dot.current { background: var(--accent-red); transform: scale(1.2); }

        /* Problem Workspace */
        .problem-area {
            background: white;
            border: 1px solid #ddd;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 2px 2px 12px rgba(0,0,0,0.05);
            min-height: 300px;
            position: relative;
        }

        .equation-display {
            font-size: 1.8em;
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eee;
        }

        .steps-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .step-row {
            font-family: 'Courier Prime', monospace;
            font-size: 1.2em;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease;
        }

        .step-row.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .step-text {
            color: #333;
        }

        .step-input {
            width: 60px;
            height: 35px;
            font-size: 1.1em;
            font-family: 'Courier Prime', monospace;
            text-align: center;
            border: 2px solid #999;
            border-radius: 4px;
            outline: none;
            background: #fafafa;
            color: var(--dark-ink);
            font-weight: bold;
            transition: 0.3s;
        }

        .step-input:focus {
            border-color: var(--dark-ink);
            background: #fff;
            box-shadow: 0 0 5px rgba(0,0,0,0.2);
        }

        .step-input.correct {
            border-color: var(--success-green);
            background-color: #eafaf1;
            color: var(--success-green);
            pointer-events: none; /* Lock input */
        }

        .step-input.wrong {
            border-color: var(--accent-red);
            background-color: #fdedec;
            color: var(--accent-red);
            animation: shake 0.3s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .next-btn {
            display: none; /* hidden until solved */
            margin: 30px auto 0;
            padding: 12px 30px;
            font-family: 'Courier Prime', monospace;
            font-size: 1.2em;
            font-weight: bold;
            color: white;
            background-color: var(--success-green);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 3px 3px 0 #1e8449;
            transition: all 0.2s;
        }

        .next-btn:active {
            transform: translate(3px, 3px);
            box-shadow: 0 0 0;
        }

        .next-btn.visible {
            display: block;
            animation: fadeIn 0.4s;
        }

        .stamp-success {
            position: absolute;
            top: 20px;
            right: 20px;
            font-family: 'Courier Prime', monospace;
            font-size: 2em;
            font-weight: bold;
            color: var(--success-green);
            border: 4px solid var(--success-green);
            padding: 5px 15px;
            transform: rotate(-15deg) scale(2);
            opacity: 0;
            border-radius: 5px;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .stamp-success.visible {
            opacity: 0.8;
            transform: rotate(-15deg) scale(1);
        }

    </style>
</head>

                <div class="steps-container" id="steps-container">

                </div>
                <button class="next-btn" id="next-btn" onclick="nextProblem()">Следующее дело ➔</button>
            </div>
        </div>
    </div>

        let currentLevel = 0;
        let currentProblem = 0;

        function initSidebar() {
            const list = document.getElementById('level-list');
            list.innerHTML = '';
            levelsData.forEach((lvl, idx) => {
                const li = document.createElement('li');
                li.className = 'level-item';
                if (idx === 0) li.classList.add('active');
                li.innerText = lvl.title;
                li.onclick = () => loadLevel(idx);
                list.appendChild(li);
            });
        }

        function loadLevel(idx) {
            currentLevel = idx;
            currentProblem = 0;
            
            // Update sidebar
            document.querySelectorAll('.level-item').forEach((li, i) => {
                li.classList.toggle('active', i === idx);
            });

            const lvl = levelsData[idx];
            document.getElementById('lvl-title').innerText = lvl.title;
            document.getElementById('lvl-hint').innerHTML = `<strong>Секретный метод:</strong> ${lvl.hint}`;
            
            loadProblem();
        }

        function renderProgress() {
            const bar = document.getElementById('progress-bar');
            bar.innerHTML = '';
            const total = levelsData[currentLevel].problems.length;
            for (let i = 0; i < total; i++) {
                const dot = document.createElement('div');
                dot.className = 'dot';
                if (i < currentProblem) dot.classList.add('completed');
                else if (i === currentProblem) dot.classList.add('current');
                bar.appendChild(dot);
            }
        }

        function loadProblem() {
            renderProgress();
            document.getElementById('stamp').classList.remove('visible');
            document.getElementById('next-btn').classList.remove('visible');
            
            const p = levelsData[currentLevel].problems[currentProblem];
            const eqContainer = document.getElementById('equation-display');
            
            // Всегда оборачиваем в MathJax для красивого и стабильного рендера
            eqContainer.innerHTML = '$$ ' + p.eq + ' $$';

            // Render mathjax
            if (window.MathJax) {
                MathJax.typesetPromise([document.getElementById('level-view')]).catch((err) => console.log(err.message));
            }

            const stepsContainer = document.getElementById('steps-container');
            stepsContainer.innerHTML = '';

            p.steps.forEach((stepArr, idx) => {
                const row = document.createElement('div');
                row.className = 'step-row';
                row.id = `step-row-${idx}`;
                
                stepArr.forEach(part => {
                    if (part.t) {
                        const span = document.createElement('span');
                        span.className = 'step-text';
                        span.innerText = part.t;
                        row.appendChild(span);
                    }
                    if (part.i !== undefined) {
                        const inp = document.createElement('input');
                        inp.type = 'text';
                        inp.className = 'step-input';
                        inp.dataset.ans = part.i;
                        // Logic to check input
                        inp.addEventListener('input', function() { checkInput(this, row, idx, p.steps.length); });
                        row.appendChild(inp);
                    }
                });
                stepsContainer.appendChild(row);
            });

            // Show first step
            document.getElementById(`step-row-0`).classList.add('visible');
            setTimeout(() => focusFirstInput(document.getElementById(`step-row-0`)), 100);
        }

        function focusFirstInput(row) {
            const inp = row.querySelector('.step-input:not(.correct)');
            if (inp) inp.focus();
        }

        function checkInput(input, row, stepIdx, totalSteps) {
            const val = parseFloat(input.value.trim().replace(',', '.'));
            const expected = parseFloat(input.dataset.ans);
            
            if (isNaN(val)) {
                input.classList.remove('wrong');
                return;
            }

            if (val === expected) {
                input.classList.remove('wrong');
                input.classList.add('correct');
                
                // Check if all inputs in this step are correct
                const allInputs = Array.from(row.querySelectorAll('.step-input'));
                const allCorrect = allInputs.every(i => i.classList.contains('correct'));
                
                if (allCorrect) {
                    if (stepIdx + 1 < totalSteps) {
                        const nextRow = document.getElementById(`step-row-${stepIdx + 1}`);
                        nextRow.classList.add('visible');
                        setTimeout(() => focusFirstInput(nextRow), 100);
                    } else {
                        // Problem solved!
                        document.getElementById('stamp').classList.add('visible');
                        document.getElementById('next-btn').classList.add('visible');
                        document.getElementById('next-btn').focus();
                    }
                } else {
                    focusFirstInput(row);
                }
            } else {
                // Only show wrong if length is matching or wait a bit? 
                // Simple approach: show red immediately if they type something wrong, but it might flash.
                // Let's check length, or just let it be red.
                input.classList.add('wrong');
            }
        }

        function nextProblem() {
            const total = levelsData[currentLevel].problems.length;
            currentProblem++;
            if (currentProblem < total) {
                loadProblem();
            } else {
                alert("Уровень пройден! Великолепная работа, детектив!");
                if (currentLevel + 1 < levelsData.length) {
                    loadLevel(currentLevel + 1);
                }
            }
        }

        // Init
        window.onload = () => {
            initSidebar();
            loadLevel(0);
        };

    </script>
