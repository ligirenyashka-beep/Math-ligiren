<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Архитектура Дробей: Визуальный Тренажер</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@400;600;800&display=swap');
        
        :root {
            --bg-color: #e9e5db;
            --folder-color: #f4ecd8;
            --dark-ink: #2b2b2b;
            --accent-red: #c0392b;
            --success-green: #27ae60;
            --highlight: #f1c40f;
            --sidebar: #273746;
            --sidebar-hover: #1f2c37;
            --blue-ink: #2980b9;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            background-image: url('https://www.transparenttextures.com/patterns/cream-paper.png');
            color: var(--dark-ink);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 330px;
            background: var(--sidebar);
            color: white;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0,0,0,0.2);
            z-index: 10;
        }

        .sidebar-header {
            padding: 20px;
            font-family: 'Courier Prime', monospace;
            text-align: center;
            border-bottom: 2px solid #111;
            background: #1b2631;
        }

        .sidebar-header h2 {
            margin: 0;
            font-size: 1.1em;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ecf0f1;
        }

        .level-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex-grow: 1;
        }

        .level-item {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.9em;
            line-height: 1.4;
        }

        .level-item:hover {
            background: var(--sidebar-hover);
        }

        .level-item.active {
            background: var(--accent-red);
            font-weight: bold;
            border-left: 5px solid #e74c3c;
        }

        .main-content {
            flex-grow: 1;
            padding: 30px 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .level-container {
            background-color: var(--folder-color);
            border: 2px solid #ccc;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.1), inset 0 0 50px rgba(220,210,190,0.5);
            border-radius: 5px 25px 5px 5px;
            width: 100%;
            max-width: 1100px;
            position: relative;
            padding: 40px;
            box-sizing: border-box;
            display: none;
        }

        .level-container.active {
            display: block;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .level-container::before {
            content: "ЛАБОРАТОРИЯ ДРОБЕЙ";
            position: absolute;
            top: -20px;
            left: -2px;
            background: var(--folder-color);
            border: 2px solid #ccc;
            border-bottom: none;
            padding: 5px 20px;
            font-family: 'Courier Prime', monospace;
            font-weight: bold;
            font-size: 0.8em;
            border-radius: 10px 10px 0 0;
            color: var(--blue-ink);
        }

        .level-title {
            font-family: 'Courier Prime', monospace;
            font-size: 1.8em;
            font-weight: bold;
            margin: 0 0 10px 0;
            border-bottom: 2px dashed #999;
            padding-bottom: 10px;
            color: #2c3e50;
        }

        .level-desc {
            font-size: 1.1em;
            background: rgba(41, 128, 185, 0.1);
            padding: 15px;
            border-left: 5px solid var(--blue-ink);
            margin-bottom: 30px;
            border-radius: 4px;
            color: #1a5276;
        }

        .progress-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 40px;
            justify-content: center;
        }

        .dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ccc;
            transition: 0.3s;
        }
        .dot.completed { background: var(--success-green); }
        .dot.current { background: var(--blue-ink); transform: scale(1.3); }

        /* WORKSPACE & MATH UI */
        .workspace {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: nowrap;
            font-size: 2.8em; 
            font-family: 'Courier Prime', monospace;
            padding: 50px 20px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 15px;
            box-shadow: 2px 2px 12px rgba(0,0,0,0.05);
            min-height: 250px;
            position: relative;
        }

        .fraction {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            margin: 0 15px;
        }

        .fraction.large {
            margin: 0 25px;
        }

        .num {
            border-bottom: 4px solid var(--dark-ink);
            padding: 5px 15px;
            min-width: 40px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            color: var(--dark-ink);
            transition: 0.3s;
        }

        .den {
            padding: 5px 15px;
            min-width: 40px;
            text-align: center;
            color: var(--dark-ink);
            transition: 0.3s;
        }

        .op {
            margin: 0 10px;
            color: #7f8c8d;
        }

        /* Multiplier Slash */
        .mult {
            position: absolute;
            bottom: 100%;
            left: -15px;
            display: flex;
            align-items: flex-end;
            margin-bottom: -15px;
        }

        .slash {
            width: 15px;
            height: 45px;
            border-right: 3px solid var(--blue-ink);
            transform: skewX(-25deg);
            margin-left: 8px;
        }

        /* Inputs */
        .input-wrap {
            position: relative;
            display: inline-block;
        }

        input {
            width: 70px;
            height: 55px;
            font-size: 0.9em;
            text-align: center;
            border: 3px dashed #bdc3c7;
            background: #fafafa;
            color: var(--dark-ink);
            border-radius: 8px;
            outline: none;
            transition: 0.3s;
            font-family: inherit;
        }

        input:disabled {
            background: transparent;
            border: none;
            color: var(--dark-ink);
            font-weight: bold;
        }

        input.active-input {
            border: 3px solid var(--blue-ink);
            background: #ebf5fb;
            box-shadow: 0 0 15px rgba(41, 128, 185, 0.3);
            color: var(--blue-ink);
            transform: scale(1.05);
            z-index: 5;
            position: relative;
        }

        input.correct {
            color: var(--success-green);
            border-bottom: 4px solid var(--success-green) !important;
            border: none;
            border-radius: 0;
            background: transparent !important;
            transform: scale(1);
            box-shadow: none;
        }

        input.wrong {
            border-color: var(--accent-red);
            background-color: #fdedec;
            color: var(--accent-red);
            animation: shake 0.3s;
        }

        /* Highlight Logic for active step context */
        .highlight {
            color: var(--accent-red) !important;
            font-weight: 800 !important;
            text-shadow: 0 0 8px rgba(231, 76, 60, 0.3);
            transform: scale(1.1);
            z-index: 4;
        }
        
        .highlight-border {
            border-color: var(--accent-red) !important;
            box-shadow: 0 0 10px rgba(231, 76, 60, 0.4);
        }

        /* Tooltips */
        .tooltip {
            position: absolute;
            background: #2c3e50;
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 16px;
            font-family: 'Montserrat', sans-serif;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            z-index: 100;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            font-weight: normal;
            letter-spacing: normal;
        }
        .tooltip::after {
            content: '';
            position: absolute;
            border: 7px solid transparent;
        }
        .tooltip.top {
            bottom: calc(100% + 15px);
            left: 50%;
            transform: translateX(-50%) translateY(5px);
        }
        .tooltip.top::after {
            top: 100%; left: 50%; transform: translateX(-50%);
            border-top-color: #2c3e50;
        }
        .tooltip.bottom {
            top: calc(100% + 15px);
            left: 50%;
            transform: translateX(-50%) translateY(-5px);
        }
        .tooltip.bottom::after {
            bottom: 100%; left: 50%; transform: translateX(-50%);
            border-bottom-color: #2c3e50;
        }
        .tooltip.right {
            left: calc(100% + 15px);
            top: 50%;
            transform: translateY(-50%) translateX(-5px);
        }
        .tooltip.right::after {
            right: 100%; top: 50%; transform: translateY(-50%);
            border-right-color: #2c3e50;
        }
        
        /* When tooltip is active, move it slightly to its final pos */
        .input-wrap:has(input.active-input) .tooltip.top { transform: translateX(-50%) translateY(0); }
        .input-wrap:has(input.active-input) .tooltip.bottom { transform: translateX(-50%) translateY(0); }
        .input-wrap:has(input.active-input) .tooltip.right { transform: translateY(-50%) translateX(0); }


        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .next-btn {
            display: none;
            margin: 40px auto 0;
            padding: 15px 40px;
            font-family: 'Courier Prime', monospace;
            font-size: 1.3em;
            font-weight: bold;
            color: white;
            background-color: var(--success-green);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 6px 0 #1e8449;
            transition: all 0.1s;
        }

        .next-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0;
        }

        .next-btn.visible {
            display: block;
            animation: fadeIn 0.4s;
        }

        .stamp-success {
            position: absolute;
            top: 20px;
            right: 20px;
            font-family: 'Courier Prime', monospace;
            font-size: 2.5em;
            font-weight: bold;
            color: var(--success-green);
            border: 5px solid var(--success-green);
            padding: 5px 15px;
            transform: rotate(-15deg) scale(2);
            opacity: 0;
            border-radius: 8px;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 50;
        }

        .stamp-success.visible {
            opacity: 0.9;
            transform: rotate(-15deg) scale(1);
        }
        
        .sync-target {
            color: var(--success-green);
            font-weight: bold;
        }
    </style>
</head>

        </div>
    </div>

        let currentLevel = 0;
        let currentProblem = 0;
        let currentStep = 1;

        function initSidebar() {
            const list = document.getElementById('level-list');
            list.innerHTML = '';
            levelsData.forEach((lvl, idx) => {
                const li = document.createElement('li');
                li.className = 'level-item';
                if (idx === 0) li.classList.add('active');
                li.innerText = lvl.title;
                li.onclick = () => loadLevel(idx);
                list.appendChild(li);
            });
        }

        function loadLevel(idx) {
            currentLevel = idx;
            currentProblem = 0;
            
            document.querySelectorAll('.level-item').forEach((li, i) => {
                li.classList.toggle('active', i === idx);
            });

            const lvl = levelsData[idx];
            document.getElementById('lvl-title').innerText = lvl.title;
            document.getElementById('lvl-hint').innerHTML = `<strong>Подсказка:</strong> ${lvl.hint}`;
            
            loadProblem();
        }

        function renderProgress() {
            const bar = document.getElementById('progress-bar');
            bar.innerHTML = '';
            const total = levelsData[currentLevel].problems.length;
            for (let i = 0; i < total; i++) {
                const dot = document.createElement('div');
                dot.className = 'dot';
                if (i < currentProblem) dot.classList.add('completed');
                else if (i === currentProblem) dot.classList.add('current');
                bar.appendChild(dot);
            }
        }

        function loadProblem() {
            renderProgress();
            document.getElementById('next-btn').classList.remove('visible');
            
            const p = levelsData[currentLevel].problems[currentProblem];
            const container = document.getElementById('workspace-container');
            
            // Insert HTML
            container.innerHTML = p.html;
            
            // Add stamp element inside workspace
            container.querySelector('.workspace').insertAdjacentHTML('afterbegin', '<div class="stamp-success" id="stamp">ОТЛИЧНО</div>');

            // Disable all inputs initially
            document.querySelectorAll('.workspace input').forEach(inp => {
                inp.disabled = true;
                inp.addEventListener('input', handleInput);
            });

            currentStep = 1;
            activateStep(currentStep);
        }

        function activateStep(stepNum) {
            // Remove old highlights and tooltips
            document.querySelectorAll('.highlight').forEach(el => el.classList.remove('highlight'));
            document.querySelectorAll('.highlight-border').forEach(el => el.classList.remove('highlight-border'));
            document.querySelectorAll('.active-input').forEach(el => el.classList.remove('active-input'));
            document.querySelectorAll('.tooltip').forEach(el => el.style.opacity = 0);

            const inputs = document.querySelectorAll(`input[data-step="${stepNum}"]`);
            if(inputs.length === 0) {
                // Problem complete
                document.getElementById('stamp').classList.add('visible');
                document.getElementById('next-btn').classList.add('visible');
                document.getElementById('next-btn').focus();
                return;
            }

            inputs.forEach(inp => {
                inp.disabled = false;
                inp.classList.add('active-input');
                
                // Show tooltip
                const tt = inp.parentElement.querySelector('.tooltip');
                if(tt) tt.style.opacity = 1;
                
                // Process highlights
                const selectors = inp.dataset.highlight;
                if(selectors) {
                    document.querySelectorAll(selectors).forEach(el => {
                        el.classList.add('highlight');
                        if(el.tagName.toLowerCase() === 'input') el.classList.add('highlight-border');
                    });
                }
            });
            
            // Focus first active input
            inputs[0].focus();
        }

        function handleInput(e) {
            const inp = e.target;
            const val = parseInt(inp.value.trim());
            const expected = parseInt(inp.dataset.ans);
            
            if (isNaN(val)) {
                inp.classList.remove('wrong');
                return;
            }

            if (val === expected) {
                inp.classList.remove('wrong');
                inp.classList.add('correct');
                inp.classList.remove('active-input');
                inp.disabled = true;
                
                // Hide tooltip
                const tt = inp.parentElement.querySelector('.tooltip');
                if(tt) tt.style.opacity = 0;
                
                // Handle Sync elements (like common denominator)
                if(inp.classList.contains('sync-source')) {
                    document.querySelectorAll('.sync-target').forEach(el => el.innerText = val);
                }
                
                // Check if all inputs for this step are correct
                const allStepInputs = Array.from(document.querySelectorAll(`input[data-step="${currentStep}"]`));
                const allCorrect = allStepInputs.every(i => i.classList.contains('correct'));
                
                if (allCorrect) {
                    currentStep++;
                    activateStep(currentStep);
                } else {
                    // Focus next empty input in this step
                    const nextInp = allStepInputs.find(i => !i.classList.contains('correct'));
                    if(nextInp) nextInp.focus();
                }
            } else {
                inp.classList.add('wrong');
            }
        }

        function nextProblem() {
            const total = levelsData[currentLevel].problems.length;
            currentProblem++;
            if (currentProblem < total) {
                loadProblem();
            } else {
                alert("Уровень блестяще пройден! Идем дальше!");
                if (currentLevel + 1 < levelsData.length) {
                    loadLevel(currentLevel + 1);
                }
            }
        }

        window.onload = () => {
            initSidebar();
            loadLevel(0);
        };
    </script>
